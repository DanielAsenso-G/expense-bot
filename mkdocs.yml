site_name: Expense Bot
site_description: A personal Telegram expense bot — build log & docs
site_url: https://danielasenso-g.github.io/expense-bot/
repo_url: https://github.com/DanielAsenso-G/expense-bot
repo_name: DanielAsenso-G/expense-bot

theme:
  name: material
  icon:
    logo: material/wallet
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - How it was built: build-log.md
  - What I learned:
      - Overview: learnings.md
      - APIs & HTTP: learnings/apis.md
      - Webhooks & networking: learnings/webhooks.md
      - Databases & SQL: learnings/databases.md
      - LLMs: learnings/llms.md
      - Secrets, Git & tooling: learnings/tooling.md
